<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e8f2ff"><title>BLOCK BLAST · 숨겨진 휴식</title><link rel="stylesheet" href="game.css"><script src="game.js" defer></script></head>
<body><main class="game-shell"><header class="game-header"><a href="index.html" class="back-link">← 소개 사이트</a><button id="game-theme" aria-label="테마 전환">◐</button></header><p class="secret-label">발견한 당신에게, 작은 휴식</p><h1>BLOCK <span>BLAST</span></h1><p class="subtitle">생각은 잠시 쉬고, 빈칸을 채워봐요.</p><div class="scoreboard"><div><span>현재 점수</span><strong id="score">0</strong></div><div><span>최고 점수</span><strong id="best">0</strong></div><button id="restart">새 게임 ↻</button></div><div class="board-wrap"><div id="board" class="board" role="grid" aria-label="8행 8열 블록 보드"></div><div id="game-over" class="overlay" hidden><div class="over-card"><span>잘했어요!</span><h2>잠깐의 휴식, 끝!</h2><p>더 놓을 수 있는 블록이 없어요.</p><strong id="final-score">0</strong><button id="play-again">다시 도전하기 ↗</button><a href="index.html">소개 사이트로 돌아가기</a></div></div><div id="combo" aria-hidden="true"></div></div><div id="tray" class="tray" aria-label="사용할 블록 3개"></div><p id="status" class="status" role="status" aria-live="polite">블록을 끌어서 보드에 놓아주세요.</p><div class="instructions"><span>01 <b>블록 놓기</b></span><span>02 <b>가로·세로 채우기</b></span><span>03 <b>한 번에 지우기!</b></span></div><p class="keyboard-help">블록을 선택한 뒤 칸을 눌러도 배치할 수 있어요.<br>키보드: 블록 선택 → 방향키로 이동 → Enter 배치 · Esc 취소</p></main><div id="drag-ghost" aria-hidden="true"></div></body></html>
